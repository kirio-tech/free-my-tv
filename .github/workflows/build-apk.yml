name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: freemytv.keystore
          key: freemytv-keystore-v1

      - name: Install Android SDK pieces
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Allow older Android versions
        run: |
          grep -nE "min-sdk-version|min-api" build.sh || true
          sed -i -E 's/--min-sdk-version [0-9]+/--min-sdk-version 26/; s/--min-api [0-9]+/--min-api 26/' build.sh
          grep -nE "min-sdk-version|min-api" build.sh || true

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV
          path: FreeMyTV.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest FreeMyTV.apk \
            --title "Mi build" \
            --notes "APK compilado automaticamente. Build #${{ github.run_number }}"
